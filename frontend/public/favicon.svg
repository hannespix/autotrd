<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- autotrd — Frosted-Aurora-Logo (font-frei: Candlestick-Aufwärtstrend) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1322"/>
      <stop offset="1" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="auroraCyan" cx="0.28" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#25d0ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#25d0ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="0.78" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#b98aff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#b98aff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#auroraCyan)"/>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#auroraViolet)"/>
  <!-- drei Kerzen, aufsteigend -->
  <g stroke-linecap="round">
    <line x1="150" y1="300" x2="150" y2="404" stroke="#2bd97c" stroke-width="14"/>
    <rect x="122" y="318" width="56" height="66" rx="14" fill="#2bd97c"/>
    <line x1="256" y1="212" x2="256" y2="330" stroke="#25d0ee" stroke-width="14"/>
    <rect x="228" y="232" width="56" height="76" rx="14" fill="#25d0ee"/>
    <line x1="362" y1="108" x2="362" y2="246" stroke="#b98aff" stroke-width="14"/>
    <rect x="334" y="130" width="56" height="92" rx="14" fill="#b98aff"/>
  </g>
</svg>
