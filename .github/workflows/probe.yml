name: Probe (Erkundung, von Hand)

# Walk-Forward über eine Erkundungs-Config — als MESSUNG, nicht als Produktivlauf.
#
# ── Der Unterschied zu optimize.yml ───────────────────────────────────────
#
# optimize.yml veröffentlicht sein Ergebnis: `meta/engineConfig` und
# `meta/champion`. Genau das darf hier NICHT passieren. Ein Champion aus
# einer Erkundung würde die Engine aller eingeschalteten Nutzer beim
# nächsten Takt umstellen — auf eine Assetklasse, ein Universum oder einen
# Bewertungsmodus, der hier gerade erst geprüft wird.
#
# Dieser Workflow hat deshalb WEDER einen Service-Account NOCH die beiden
# Veröffentlichungs-Schritte. Er kann Firestore nicht anfassen, auch nicht
# versehentlich. Das Ergebnis ist ein Artefakt, das ein Mensch liest.
#
# Ein Ergebnis von hier darf erst auf die Plattform, wenn es dieselbe
# Walk-Forward-Prüfung bestanden hat UND das Konzentrations-Gate steht
# (ein einzelner starker Fold ist kein Beleg).

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Welche Erkundung'
        required: true
        default: 'config/pooled-us30.yaml'
        type: choice
        options:
          - config/pooled-us30.yaml
          - config/equity-60.yaml
          - config/equity-1440.yaml
          - config/basis-1440.yaml
          - config/basis-1440-v2.yaml
          - config/crypto-60.yaml
          - config/crypto-1440.yaml
      samples:
        description: 'Stichproben je Fold (leer = Config)'
        required: false
        default: ''
      allowShort:
        description: 'Shorts für diese MESSUNG erlauben (Config bleibt unberührt)'
        required: false
        default: 'nein'
        type: choice
        options:
          - nein
          - ja
      asOf:
        description: 'Stichtag YYYY-MM-DD (leer = heute) — der Lauf sieht nichts danach'
        required: false
        default: ''

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      CONFIG: ${{ github.event.inputs.config }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci

      # Eigener Cache-Schlüssel: Krypto-Bars dürfen den Aktien-Cache von
      # optimize.yml nicht überschreiben und umgekehrt.
      - name: Bars-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: var-probe/bars
          key: probe-bars-${{ hashFiles(github.event.inputs.config) }}-${{ github.run_id }}
          restore-keys: |
            probe-bars-${{ hashFiles(github.event.inputs.config) }}-

      # Doppelter Boden: Der choice-Eingang lässt ohnehin nur Erkundungs-
      # Dateien zu — aber wenn jemand später eine Option ergänzt, darf hier
      # NIE die Plattform-Config laufen. Ihre Symbole und ihr Champion sind
      # das, was Nutzer tatsächlich handeln.
      - name: Guard — niemals die Plattform-Config
        run: |
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config nicht gefunden: $CONFIG"; exit 1
          fi
          case "$CONFIG" in
            config/platform.yaml)
              echo "::error::$CONFIG ist die Plattform-Config — dieser Workflow ist nur für Erkundungen."
              exit 1 ;;
          esac
          echo "Config: $CONFIG"

      - name: Keys prüfen
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::error::ALPACA_API_KEY / ALPACA_SECRET_KEY fehlen als Repository-Secrets."
            exit 1
          fi
          printf 'ALPACA_API_KEY=%s\nALPACA_SECRET_KEY=%s\nALPACA_ALLOW_LIVE=0\n' "$ALPACA_API_KEY" "$ALPACA_SECRET_KEY" > "$RUNNER_TEMP/.env"
          chmod 600 "$RUNNER_TEMP/.env"

      # Der Stichtag gilt für die MESSUNG (Universumswahl, Walk-Forward, Holdout).
      # `fetch` lädt weiterhin alles — geschnitten wird beim LESEN (src/app.ts),
      # damit keine Stelle den Schnitt vergessen kann.
      - name: Stichtag prüfen
        id: asof
        env:
          AS_OF: ${{ github.event.inputs.asOf }}
        run: |
          if [ -n "$AS_OF" ]; then
            case "$AS_OF" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *) echo "::error::asOf muss YYYY-MM-DD sein: '$AS_OF'"; exit 1 ;;
            esac
            # Ein Lauf hat EINE Uhr. Der Stichtag geht an JEDES Kommando des
            # Laufs — universe, fetch, optimize. Bis zum 09.09. fehlte er bei
            # `fetch`: Das lud Bars ab HEUTE (mit --days 3600 als Ausgleich) und
            # maß das Alter der Stichtags-Auswahl gegen die Wanduhr — 186 Tage,
            # Abbruch (Läufe 21–23). Mit dem Stichtag zählt `fetch` wie
            # `optimize` vom Stichtag rückwärts; ein Ausgleich ist nicht nötig.
            echo "flag=--as-of $AS_OF" >> "$GITHUB_OUTPUT"
            echo "Stichtag: $AS_OF"
          fi

      # Punkt-in-Zeit-Universum: Ohne diesen Schritt handelt eine Messung über
      # acht Jahre die HEUTE liquidesten 30 Werte rückwirkend — also genau die
      # Firmen, von denen wir inzwischen wissen, dass sie groß geblieben sind.
      # Je tiefer das Fenster, desto teurer wird dieser Bias; mit `--as-of`
      # wählt die Auswahl nur aus Daten bis zum Stichtag. Ohne Kandidatenpool
      # in der Config sagt das Kommando das und lässt die Config-Liste stehen.
      - name: Handelsuniversum wählen (Stichtag gilt auch hier)
        run: node src/cli.ts universe --config "$CONFIG" --env "$RUNNER_TEMP/.env" --home var-probe ${{ steps.asof.outputs.flag }}

      - name: Bars nachladen
        run: node src/cli.ts fetch --config "$CONFIG" --env "$RUNNER_TEMP/.env" --home var-probe --universe var-probe/universe.json ${{ steps.asof.outputs.flag }}

      - name: Walk-Forward-Optimierung
        env:
          # Nie in den Shell-Text interpolieren (Secreview 2, G5): kommt als
          # Umgebungsvariable und muss eine ganze Zahl sein.
          SAMPLES_OVERRIDE: ${{ github.event.inputs.samples }}
          # Nie in den Shell-Text interpolieren; der choice-Eingang lässt nur ja/nein zu.
          ALLOW_SHORT: ${{ github.event.inputs.allowShort }}
        run: |
          if [ -n "$SAMPLES_OVERRIDE" ]; then
            case "$SAMPLES_OVERRIDE" in
              ''|*[!0-9]*) echo "::error::samples muss eine ganze Zahl sein: '$SAMPLES_OVERRIDE'"; exit 1 ;;
            esac
            echo "Hinweis: samples-Override ($SAMPLES_OVERRIDE) wird über die Config gesetzt."
            sed -i "s/^  samples: .*/  samples: $SAMPLES_OVERRIDE/" "$CONFIG"
          fi
          # `--allow-short` ist ein MESS-Schalter: Er wirkt nur in optimize/backtest
          # und lässt risk.allowShort in der Config unberührt (src/cli.ts). Was
          # Nutzer handeln, entscheidet weiterhin allein die Plattform-Config.
          SHORT=""
          if [ "$ALLOW_SHORT" = "ja" ]; then SHORT="--allow-short"; fi
          node src/cli.ts optimize --config "$CONFIG" --env "$RUNNER_TEMP/.env" --home var-probe --universe var-probe/universe.json $SHORT ${{ steps.asof.outputs.flag }} --equity 25000

      - name: Bericht als Artefakt
        # `always()`: Gerade der Lauf, der NICHTS gemessen hat (Rückgabecode 3),
        # ist der, dessen Bericht man lesen muss. Ohne dies verschwände er.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            var-probe/champion.json
            var-probe/universe.json
            var-probe/reports/optimize-*.md
            var-probe/reports/universe-*.md
          retention-days: 90

      - name: Ergebnis in der Zusammenfassung
        if: always()
        run: |
          {
            echo "## Probe — $CONFIG"
            echo
            echo "**Nicht veröffentlicht.** Dieser Lauf schreibt nichts nach Firestore;"
            echo "das Ergebnis liegt als Artefakt \`probe-${{ github.run_id }}\`."
            echo
            if [ -f var-probe/champion.json ]; then
              node -e '
                const c = require("./var-probe/champion.json");
                const s = Object.keys(c.symbols ?? {});
                const n = Object.keys(c.noTrade ?? {});
                console.log("| | |"); console.log("|---|---|");
                console.log("| Gehandelt | " + (s.length ? s.join(", ") : "_keins_") + " |");
                console.log("| noTrade | " + (n.length ? n.join(", ") : "—") + " |");
              '
            else
              echo "_Kein champion.json — der Lauf ist vor der Auswertung abgebrochen._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
