name: Deploy Frontend (webgo)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Guard (MILESTONES M1): solange die FTP-Secrets fehlen, wird der Deploy
    # sauber übersprungen statt rot zu werden.
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
    steps:
      - name: Guard — FTP-Secrets vorhanden?
        if: env.FTP_HOST == ''
        run: echo "::warning::FTP_HOST/FTP_USERNAME/FTP_PASSWORD fehlen — Frontend-Deploy übersprungen."

      - uses: actions/checkout@v5
        if: env.FTP_HOST != ''
      - uses: actions/setup-node@v5
        if: env.FTP_HOST != ''
        with:
          node-version: 22
          cache: npm
      - name: Build
        if: env.FTP_HOST != ''
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
        run: |
          npm ci
          npm run build -w frontend

      # Netz-Diagnose vor dem Upload (26.07.): „Timeout (control socket)" sagt
      # nicht, WORAN es liegt. Ein DROP (Timeout) statt REJECT (connection
      # refused) auf Port 21 ist das typische Bild einer Fail2ban-/Firewall-
      # Sperre — genau das erwartet man nach einem Dutzend Deploys in Folge.
      # Der Test zeigt außerdem, ob Port 22 (SFTP) offen ist; davon hängt ab,
      # ob der Fallback unten überhaupt greifen kann. Secrets bleiben maskiert.
      - name: Netz-Diagnose (Port 21/22)
        if: env.FTP_HOST != ''
        continue-on-error: true
        run: |
          H='${{ secrets.FTP_HOST }}'
          echo "DNS:"; getent hosts "$H" || echo "  keine Auflösung"
          for P in 21 22; do
            if nc -zvw5 "$H" "$P" 2>&1 | tail -1; then
              echo "Port $P: OFFEN"
            else
              echo "Port $P: keine Verbindung (Timeout = gedroppt/gesperrt, refused = Dienst aus)"
            fi
          done

      # HAUPTWEG seit 26.07.: SFTP über SSH (Port 22). Port 21 (FTPS) ist von
      # webgo dauerhaft für die GitHub-Runner gesperrt (Timeout = DROP), SSH
      # dagegen läuft. Zwei Lehren aus dem Diagnose-Lauf:
      #   a) Zielpfad ist www/<domain>/ — die SFTP-Wurzel ist das SSH-Home,
      #      NICHT die FTP-Wurzel ('autotrd.net/' landete auf /home/autotrd.net).
      #   b) webgo drosselt neue SSH-Verbindungen: Jedes eigene `lftp -c` baut
      #      eine NEUE Verbindung auf, ab der zweiten kam nur noch
      #      „max-retries exceeded". Deshalb läuft ALLES in EINER Session.
      - name: SFTP-Upload zu webgo (Port 22)
        id: sftp
        if: env.FTP_HOST != ''
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          # Eigene Variable, weil die SFTP-Wurzel (SSH-Home) nicht die
          # FTP-Wurzel ist. FTP_SSH_DIR überschreibt bei abweichendem Layout.
          SFTP_DIR: ${{ vars.FTP_SSH_DIR || 'www/autotrd.net' }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass
          # accept-new: Host-Key wird beim ersten Mal übernommen, ein späterer
          # WECHSEL bricht ab (Schutz vor Umleitung).
          # cd VOR mirror in derselben Session: Existiert das Ziel nicht,
          # scheitert der cd und mirror --delete kann keinen fremden Ordner
          # leerräumen.
          lftp -c "
            set sftp:connect-program 'sshpass -e ssh -a -x -o StrictHostKeyChecking=accept-new';
            set net:timeout 40; set net:max-retries 2; set net:reconnect-interval-base 10;
            open -u ${SFTP_USER},dummy sftp://${SFTP_HOST};
            cd ${SFTP_DIR};
            pwd;
            mirror -R --delete --parallel=2 --exclude-glob .ftp-deploy-sync-state.json frontend/dist/ .;
            cls -l index.html;
          "

      # FTPS (TLS), niemals plain FTP — ARCHITECTURE.md §9.
      # Plain FTP wäre hier ohnehin keine Lösung: FTPS explicit läuft auf
      # DEMSELBEN Port 21 und verhandelt TLS erst nach dem Verbindungsaufbau —
      # ein Timeout auf dem Kontrollkanal passiert davor. Unverschlüsselt
      # würde nur das Passwort im Klartext gehen, nicht der Upload gelingen.
      #
      # Achtung Sync-State-Falle: Der Server-State (.ftp-deploy-sync-state.json)
      # erinnerte einen längst gelöschten icons/-Ordner; dessen Löschversuch
      # schlug mit FTP 550 fehl → State wurde nie neu geschrieben → JEDER Lauf
      # rot. Deshalb liegt in frontend/public/icons/ eine .keep-Datei: solange
      # der Ordner lokal existiert, versucht die Action keinen Ordner-Löschvorgang
      # und der Sync (inkl. State-Update) läuft durch. NICHT entfernen, ohne die
      # Folge-Deploys zu beobachten.
      # Der webgo-FTPS-Kontrollkanal ist gelegentlich minutenlang taub
      # (26.07.: 2× „Timeout (control socket)" nach exakt 30 s, HTTP lief
      # weiter). Deshalb: großzügiger Timeout + zweiter Versuch nach Pause.
      - name: FTPS-Upload zu webgo (Rückfallweg, Port 21)
        id: ftp1
        if: env.FTP_HOST != '' && steps.sftp.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: frontend/dist/
          # Zielverzeichnis RELATIV zur FTP-Wurzel des Accounts (Trailing-Slash
          # pflicht). Ohne diese Angabe lädt die Action in die FTP-Wurzel —
          # bei webgo landet das direkt in www/ statt im Site-Ordner.
          # Abweichler setzen die Repo-Variable FTP_SERVER_DIR (SETUP.md §D).
          server-dir: ${{ vars.FTP_SERVER_DIR || 'autotrd.net/' }}

      - name: Pause vor zweitem Versuch
        if: env.FTP_HOST != '' && steps.sftp.outcome == 'failure' && steps.ftp1.outcome == 'failure'
        run: sleep 90

      - name: FTPS-Upload zu webgo (2. Versuch)
        id: ftp2
        if: env.FTP_HOST != '' && steps.sftp.outcome == 'failure' && steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: frontend/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'autotrd.net/' }}

      - name: Ergebnis — mindestens ein Upload muss durchgekommen sein
        if: env.FTP_HOST != ''
        run: |
          if [ "${{ steps.ftp1.outcome }}" = "success" ] \
            || [ "${{ steps.ftp2.outcome }}" = "success" ] \
            || [ "${{ steps.sftp.outcome }}" = "success" ]; then
            echo "Upload erfolgreich (sftp=${{ steps.sftp.outcome }} ftps1=${{ steps.ftp1.outcome }} ftps2=${{ steps.ftp2.outcome }})"
          else
            echo "::error::Weder SFTP (Port 22) noch FTPS (Port 21, 2 Versuche) kamen durch — siehe Netz-Diagnose oben. Bei 'No such file' stimmt FTP_SSH_DIR nicht, bei Timeout ist die Runner-IP serverseitig gesperrt."
            exit 1
          fi
