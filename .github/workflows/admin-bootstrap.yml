# Admin-Bootstrap (Owner-Werkzeug, 02.08.): gibt einem Konto per E-Mail das
# Admin-Recht der App — für den ALLERERSTEN Admin, den das adminUsers-Callable
# nicht ernennen kann (es verlangt einen bestehenden Admin, Henne-Ei).
#
# Zwei gleichwertige Auslöser, beide hinter Repo-Schreibrecht:
#   1. workflow_dispatch mit email-Input (Actions-UI, „Run workflow").
#   2. Push auf main, der ops/first-admin.txt ändert — die Datei enthält die
#      E-Mail. Nötig, weil App-Integrationen (wie die Coding-Session) kein
#      dispatch dürfen (403 Resource not accessible by integration), pushen
#      aber schon; die Vertrauensstufe ist identisch, denn pushen kann nur,
#      wer auch dispatchen dürfte. Alle weiteren Ernennungen laufen über die
#      Admin-Karte in der App.
name: Admin-Bootstrap

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'E-Mail des Kontos, das Admin-Rechte bekommt'
        required: true
        type: string
  push:
    branches: [main]
    paths: ['ops/first-admin.txt']

concurrency: admin-bootstrap

jobs:
  grant:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Guard — Service-Account hinterlegt?
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "::error::FIREBASE_SERVICE_ACCOUNT fehlt (siehe docs/SETUP.md)."
          exit 1

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Kein npm ci: set-admin.mjs + gcp-lite.mjs sind dependency-frei.
      - name: Admin-Recht setzen
        env:
          # Über env statt Inline-Interpolation — Workflow-Inputs gehören nie
          # ungeprüft in eine Shell-Zeile (Injection). Beim Push-Auslöser ist
          # der Input leer, dann kommt die E-Mail aus ops/first-admin.txt.
          EMAIL_INPUT: ${{ inputs.email }}
        run: |
          set -euo pipefail
          EMAIL="${EMAIL_INPUT:-$(tr -d '[:space:]' < ops/first-admin.txt)}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            node scripts-ci/set-admin.mjs "$EMAIL"
