name: Scan-Watchdog

# Stopgap, solange der Deploy-SA keine Cloud-Scheduler-Rolle hat: stößt
# regelmäßig einen Scan an — aber NUR, wenn der öffentliche Heartbeat
# meta/health älter als 12 min ist (kein Doppel-Scan, sobald der echte
# Cloud Scheduler läuft; dann kostet der Lauf nur den Heartbeat-Check).
# Dependency-frei (kein npm ci) → Laufzeit wenige Sekunden.

on:
  schedule:
    # 13–21 UTC deckt 9:30–16:00 ET in Sommer- und Winterzeit ab (Mo–Fr).
    # 15-min-Raster statt 30: GitHub verzögert/verwirft Schedule-Läufe massiv
    # (beobachtet 25.07.: stündliches Raster feuerte nur ~alle 2–3 h) — dichter
    # planen senkt die reale Heartbeat-Lücke; --if-stale 12 verhindert
    # Doppel-Scans, sobald der echte Cloud Scheduler läuft.
    - cron: '*/15 13-21 * * 1-5'
    # Depot-Vision: Krypto handelt 24/7, Forex/Rohstoffe ~24/5 — außerhalb
    # des US-Fensters stündlich (Actions-Minuten-Budget; die volle 5-min-
    # Kadenz übernimmt der Cloud Scheduler nach der Rollen-Vergabe).
    - cron: '17 0-12,22-23 * * *'
    - cron: '17 13-21 * * 0,6'
  workflow_dispatch:

concurrency: scan-watchdog

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Guard — Firebase-Secret vorhanden?
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT fehlt — Watchdog übersprungen."

      - uses: actions/checkout@v5
        if: env.FIREBASE_SERVICE_ACCOUNT != ''

      - name: Service-Account bereitstellen
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Scan anstoßen, wenn Heartbeat älter als 12 min
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node scripts-ci/invoke-scan.mjs --if-stale 12
