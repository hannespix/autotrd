name: Deploy Functions (Firebase)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_daily:
        description: >-
          Tages-Läufe erzwingen, auch wenn sie heute schon liefen. Nötig,
          wenn ein Deploy eine NEUE Kennzahl einführt: Der Tageslauf hat
          dann bereits stattgefunden, das Gate überspringt ihn, und die
          Zahl erschiene erst am Folgetag.
        type: boolean
        default: false

concurrency: deploy-functions

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Guard (MILESTONES M1): ohne Service-Account wird der Deploy sauber
    # übersprungen statt rot zu werden.
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Guard — Firebase-Secret vorhanden?
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT fehlt — Functions-Deploy übersprungen."

      - uses: actions/checkout@v5
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
      - uses: actions/setup-node@v5
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm ci

      - name: Service-Account bereitstellen
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      # Baut functions über den predeploy-Hook aus firebase.json mit.
      #
      # Deploy UND Verdikt stehen bewusst in EINEM Schritt: Das Verdikt kennt
      # drei Ausgänge (tolerierbar · transient · hart rot), und nur „transient"
      # darf einen zweiten Anlauf auslösen. Zwei getrennte Schritte könnten
      # das nicht — ein Schritt kann sich nicht selbst wiederholen.
      #
      # Anlass war Deploy #104 (27.07.): HTTP 503 von serviceusage.googleapis
      # mitten im API-Check. Ein Google-Aussetzer, ohne jeden Bezug zum
      # Projektzustand — und er kostete den kompletten Deploy, obwohl ein
      # zweiter Versuch 20 Sekunden später durchgelaufen wäre.
      - name: Deploy functions + firestore (Rules UND Indexe)
        id: fbdeploy
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -o pipefail
          for versuch in 1 2 3; do
            # --only firestore = Rules + Indexe (firestore.indexes.json), damit
            # Regeln und Functions immer aus demselben Stand kommen.
            if npx firebase-tools deploy --only functions,firestore --non-interactive --force 2>&1 \
                 | tee "$RUNNER_TEMP/deploy.log"; then
              echo "Deploy erfolgreich (Versuch $versuch)."
              exit 0
            fi
            status=0
            node scripts-ci/deploy-verdict.mjs "$RUNNER_TEMP/deploy.log" || status=$?
            # Bewusst `if` statt `[ … ] && exit`: GitHub startet diesen Schritt
            # mit `bash -e`, und dort beendet eine fehlschlagende &&-Liste als
            # ganzes Statement das Skript — der Retry käme nie zum Zug.
            if [ "$status" -eq 0 ]; then exit 0; fi   # tolerierbar — Code ist deployt
            if [ "$status" -ne 2 ]; then exit 1; fi   # hart rot
            warte=$((versuch * 30))
            echo "::warning::Transienter Google-Fehler — Versuch $versuch von 3, neuer Anlauf in ${warte}s."
            sleep "$warte"
          done
          echo "::error::Deploy auch im dritten Anlauf an transienten Google-Fehlern gescheitert."
          exit 1

      # „Deploy complete!" heißt bei firebase-tools nur „keine Fehler
      # gemeldet" — nach dem 13.08. heißt es NICHT „der Code läuft": Ein
      # Google-seitig abgebrochener Deploy (Cloud Builds CANCELLED) hinterließ
      # neue Quell-Hash-Metadaten auf allen Functions; der nächste Lauf
      # übersprang deshalb ALLE Functions („Skipped — No changes detected")
      # und wurde grün, während produktiv der alte Stand weiterlief. Dieser
      # Schritt fragt die GCF-API nach dem echten Zustand. Steht eine Function
      # nicht auf ACTIVE, erzwingt eine Stempel-Datei im Functions-Paket einen
      # echten Rollout (anderer Tarball-Hash ⇒ kein Skip möglich) und prüft
      # danach erneut — erst DAS ist der Beleg, dass der Code läuft.
      - name: Functions-Zustand prüfen (+ Selbstheilung bei stalem Skip)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -o pipefail
          if node scripts-ci/check-functions-state.mjs; then exit 0; fi
          echo "::warning::Nicht-ACTIVE Functions gefunden — erzwinge echten Rollout über Stempel-Datei."
          printf 'Heilungs-Rollout %s Run %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > functions/deploy-stamp.txt
          for versuch in 1 2 3; do
            if npx firebase-tools deploy --only functions --non-interactive --force 2>&1 \
                 | tee "$RUNNER_TEMP/heal.log"; then
              break
            fi
            status=0
            node scripts-ci/deploy-verdict.mjs "$RUNNER_TEMP/heal.log" || status=$?
            if [ "$status" -eq 0 ]; then break; fi
            if [ "$status" -ne 2 ]; then exit 1; fi
            warte=$((versuch * 30))
            echo "::warning::Transienter Google-Fehler beim Heilungs-Rollout — Versuch $versuch von 3, neuer Anlauf in ${warte}s."
            sleep "$warte"
          done
          node scripts-ci/check-functions-state.mjs

      # firebase-tools setzt den Invoker bei Callable-UPDATES nie — einmal
      # privat angelegte Callables blieben sonst für immer privat (403 ohne
      # CORS-Header). Läuft auch nach Teil-Fehlern des Deploys (!cancelled).
      - name: Callables öffentlich schalten
        if: ${{ !cancelled() && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node scripts-ci/set-public-invoker.mjs ensureprofile savestrategy

      # Live-Abnahme im Log: Scheduler-Jobs listen, den Herzschlag-Lauf einmal
      # anstoßen, danach den öffentlichen Heartbeat meta/health prüfen.
      # (Der Herzschlag-Job zeigt bis zur Integration des Engine-Takts noch
      # auf den gelöschten Marktscan — siehe check-scheduler.mjs.)
      - name: Scheduler-Diagnose + Scan-Force-Run
        if: ${{ !cancelled() && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node scripts-ci/check-scheduler.mjs

      # Welche Secrets liegen im Projekt? Ein Secret an eine Function zu
      # binden, das es nicht gibt, bricht den GESAMTEN Deploy — also erst
      # messen, dann binden. Liest nur Metadaten, nie den Wert; macht den
      # Deploy nie rot.
      - name: Secret-Diagnose (nur Metadaten)
        if: ${{ !cancelled() && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: >-
          node scripts-ci/check-secret.mjs BROKER_MASTER_KEY
          ALPACA_API_KEY ALPACA_SECRET_KEY

      # Aufwärm-Lauf nach dem Deploy: Die Zeitpläne stehen (der Schritt davor
      # legt sie an), aber snapshotEquity feuert erst am Abend. Hier
      # dranzuhängen heißt: Nach jedem Merge ist die Performance-Karte binnen
      # Minuten gefüllt statt erst nach US-Schluss.
      #
      # Das ist KEIN Ersatz-Scheduler — der echte Scheduler feuert selbst.
      # Das Gate im Skript unterscheidet „heute schon gelaufen" von „heute
      # NACH US-Schluss gelaufen" — ein Mittags-Snapshot füllt die Karte,
      # verdrängt aber den Abend-Lauf nicht, dessen Schlusskurs die
      # Equity-Serie tragen soll.
      #
      # Prognose-Bewertung, Universum-Sync, Momentum-Lauf und KI-Bericht sind
      # mit dem Rückbau der alten Handelsplattform entfallen.
      - name: Tages-Lauf anstoßen (Equity-Snapshot)
        if: ${{ !cancelled() && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: >-
          node scripts-ci/invoke-daily.mjs
          --only snapshotequity
          ${{ inputs.force_daily && '--force' || '' }}

      # Wenn der Lauf rot wurde (z. B. Invoke 500): Fehlerlogs des Engine-Takts
      # direkt ins Job-Log ziehen — die Ursache soll ohne GCP-Konsole lesbar sein.
      - name: Engine-Fehlerlogs (Diagnose bei Rot)
        if: ${{ failure() && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node scripts-ci/fetch-scan-logs.mjs 30 DEFAULT
