# Basis-Allokation V4 — Probe-Config: Notbremsen JE STUFE
#
# = config/basis-1440-v3.yaml mit genau ZWEI Unterschieden: `risk.tiers.basis`
# bekommt eigene Notbremsen (5 % / 30 %), und `paths.home` zeigt woandershin.
# Alles andere — Gate-Schwellen der Gruppe `basis`, Kosten, Fold-Plan,
# Basis-Korb, Parameter des Festkandidaten, Bremsen des Alpha — ist unberührt.
#
# ── Was gemessen wird und warum ───────────────────────────────────────────
#
# V3 (#40) ist an zwei Gates gescheitert, und die Auswertung hat die Ursache
# benannt: die Tagesbremse von 2 %.
#
#   basis_drawdown  8,27 % / 51,9 % = 15,95 %  gegen Latte 15,48 %  ✘ knapp
#   basis_sharpe    0,48                       gegen Latte 0,61     ✘
#
# Die 90-Tage-Scheiben sind bis Juni 2024 auf den Cent identisch mit V2
# (Bremsen 5 %/30 %); danach Scheibe 10 +203 $ statt +1 044 $ und Scheibe 13
# (Zollcrash) −750 $ statt +712 $. Das ist die Signatur der Bremse: Ein
# Buchtag unter −2 % stellt ALLES glatt, der Wiedereinstieg kommt erst im
# nächsten Monatsfenster, die Erholung wird verpasst. Die Bremse
# VERSCHLECHTERT den Drawdown je Einheit Exposure (15,95 % gegen 12,06 %),
# weil sie Verluste festschreibt und Erholungen auslässt.
#
# Das V3-Dokument nennt zwei Wege und sagt ausdrücklich, die Wahl sei eine
# OWNER-Entscheidung, keine Messfrage:
#
#   (a) Regelwerk behalten ⇒ die Basis ist auf dieser Plattform nicht
#       einsetzbar.
#   (b) Bremsen je Stufe — "für die Basis: Tagesverlust sperrt nur
#       Einstiege, oder Schwelle 5 %; Drawdown-Halt mit resume zum nächsten
#       Fenster".
#
# Diese Config MISST (b), Variante "Schwelle 5 %". Sie aktiviert nichts,
# ändert config/platform.yaml nicht und befördert nichts. Ihr Zweck ist, dass
# die Entscheidung Zahlen hat statt Vermutungen. Nimmt die Basis ihre Latte
# auch damit nicht, wird sie nicht aktiviert — das Argument "eine
# Monatsallokation braucht eine andere Bremse als ein Intraday-Signal" ist
# ein Argument, kein Freibrief.
#
# ── Warum nur die Basis eigene Bremsen bekommt ────────────────────────────
#
# `risk.tiers.alpha` bleibt auf null und trägt weiter die 2 %/10 % der
# Plattform. Zwei Änderungen zugleich zu messen war der Fehler in Lauf #46
# und wird nicht wiederholt. Die globalen Werte bleiben ebenfalls stehen: Sie
# gelten für alles OHNE Stufe; ein Stufenwert übersteuert nur seine eigene
# Stufe (src/risk/limits.ts, `grenzenFuer`).
#
# ── Woher die Zahlen 5 und 30 kommen ──────────────────────────────────────
#
# Es sind die Werte, unter denen die Basis in V2 (#37) ihre Latte genommen
# hat (Drawdown je Einheit Exposure 12,06 % gegen 15,48 %, Sharpe 0,79 gegen
# 0,61). Sie sind NICHT gesucht und werden in diesem Lauf nicht variiert; wer
# sie variiert, zählt die Versuche.

