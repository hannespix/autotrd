# ─────────────────────────────────────────────────────────────────────────
# autotrd — Beispiel-Konfiguration (Schema: src/core/config.ts)
#
# Nach /etc/autotrd/config.yaml (Server) bzw. ./config.yaml (lokal) kopieren.
# Secrets (Alpaca-Keys, Telegram) stehen NICHT hier, sondern in .env —
# siehe .env.example. Jede Option ist kommentiert; die Werte sind die
# empfohlenen Startwerte für einen Paper-Betrieb.
#
# Echtgeld-Doppel-Guard: broker.mode=live wirkt nur zusammen mit
# ALPACA_ALLOW_LIVE=1 in .env UND einem Live-Key (AK…). Fehlt eines davon,
# läuft der Prozess als Paper — ein Live-Key gegen Paper wird abgelehnt.
# ─────────────────────────────────────────────────────────────────────────

broker:
  # paper | live — Paper ist der Default und bleibt es, bis die Live-Reife
  # (autotrd readiness) erreicht ist.
  mode: paper
  # Datenfeed für Backtest UND Live: iex (kostenlos, nur IEX-Börse) oder sip
  # (alle Börsen, kostenpflichtiges Alpaca-Datenabo). Immer derselbe Feed
  # für Messung und Handel — sonst misst man etwas anderes, als man handelt.
  feed: iex
  # Bereinigung der TAGESBARS (Alpaca adjustment): raw | split | dividend | all.
  # raw (Default) sind Preisbars, wie sie gehandelt wurden — ohne Ausschüttungen
  # und Splits. `all` rechnet beides heraus: richtig für Signale auf Anleihe-
  # und Dividenden-ETFs (TLT, IEF, LQD, HYG), denen roh 3–6 % Rendite im Jahr
  # fehlen und die im Momentum-Vergleich mit Aktien-ETFs zu schwach aussehen.
  # Wirkt nur auf Tagesbars (timeframe 1440 und die Universumswahl);
  # Minutenbars bleiben roh, die Ausführung läuft ohnehin zu echten Kursen.
  # Jede Bereinigung hat ihren eigenen Bars-Cache
  # (bars/<assetClass>/<feed>-adj-<wert>/); bereinigte Tagesbars werden bei
  # jedem fetch vollständig neu geladen, weil Alpaca sie relativ zum
  # Abrufdatum bereinigt.
  adjustment: raw

universe:
  # us_equity | crypto. Krypto handelt 24/7 in UTC-Tagen, kein Short.
  assetClass: us_equity
  # Gehandelte Symbole in Alpaca-Schreibweise (max. 50). Liquide Werte mit
  # engem Spread — bei IEX-Daten sind illiquide Titel lückenhaft.
  symbols:
    - SPY
    - QQQ
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - META
    - GOOGL
    - AMD
    - TSLA
  # Benchmark für Marktfilter der Strategien. Wird mitgeladen, nie gehandelt.
  benchmark: SPY

# Strategie-Zeitrahmen in Minuten: 1, 2, 3, 5, 10, 15, 30, 60 oder 1440
# (Tagesbars). Höhere Zeitrahmen entstehen lokal aus 1-Minuten-Bars.
timeframe: 5

session:
  # Keine Einstiege in den ersten X Minuten nach Eröffnung (Eröffnungsrauschen).
  noEntryFirstMin: 5
  # Keine Einstiege in den letzten X Minuten vor Schluss.
  noEntryLastMin: 30
  # Intraday-Strategien: X Minuten vor Schluss alles glattstellen.
  flattenBeforeCloseMin: 5

risk:
  # Risiko je Trade in % der Equity — die Distanz Einstand ↔ Stop, nicht
  # die Positionsgröße. 0.5 % heißt: Ein Stop-Fill kostet 0,5 % des Kontos.
  riskPerTradePct: 0.5
  # Deckel für eine einzelne Position in % der Equity.
  maxPositionPct: 20
  # Höchstzahl gleichzeitig offener Positionen (inkl. offener Einstiegs-Orders).
  maxPositions: 4
  # Brutto-Exposure (Summe aller |Positionen|) in % der Equity. 100 = kein Hebel.
  maxGrossExposurePct: 100
  # Tages-Notbremse: Ab diesem Tagesverlust (in %) wird alles glattgestellt
  # und bis zum nächsten Handelstag pausiert.
  maxDailyLossPct: 2
  # Drawdown-Sperre vom Equity-Hoch (in %): Halt bis zu einem manuellen
  # `autotrd resume`, das den Peak neu setzt und im Journal steht.
  maxDrawdownPct: 10
  # Leerverkäufe erlauben? Nur Aktien; Krypto kennt bei Alpaca kein Short.
  allowShort: false
  pdt:
    # Pattern-Day-Trader-Regel respektieren: Unter minEquity höchstens
    # maxDayTrades Daytrades in fünf Handelstagen — der vierte sperrt das Konto.
    respect: true
    # Equity-Schwelle der PDT-Regel (FINRA: 25 000 $).
    minEquity: 25000
    # Erlaubte Daytrades im 5-Tage-Fenster unterhalb der Schwelle (0–3).
    maxDayTrades: 3

strategy:
  # Fallback-Strategie, wenn keine Champion-Datei (aus `autotrd optimize`) vorliegt:
  # trend_donchian | momentum_pullback | mean_reversion
  id: trend_donchian
  # Feste Parameter für den Fallback (leer = Strategie-Defaults). Ausschließlich
  # Zahlen, z. B. { channelLen: 20, atrLen: 14 } — siehe paramSpace der Strategie.
  params: {}
  # Ohne Champion handeln? false = ohne bestandene Walk-Forward-Prüfung wird
  # NICHT gehandelt (Kein Handel ist ein reguläres Ergebnis). true nur für
  # Paper-Erkundung.
  allowWithoutChampion: false
  # Basis-Stufe handeln: Trägt champion.json einen Block `basis` mit bestandener
  # Basis-Latte und passendem Zeitrahmen, handelt die Engine dessen Korb mit
  # dessen Parametern und Allokations-Sizing (Position = positionPct der Equity
  # je Symbol) — nur für Symbole ohne Alpha-Champion. Vorgabe an; auf der
  # Plattform setzt der Nutzer-Schalter settings.auto.basis dieses Feld.
  basis: true

optimizer:
  # Strategien, die der Walk-Forward-Optimierer gegeneinander prüft.
  strategies:
    - trend_donchian
    - momentum_pullback
    - mean_reversion
  # Historie in Kalendertagen, die geladen und bewertet wird.
  lookbackDays: 400
  # In-Sample-Fenster je Fold (Kalendertage): hier wird gesucht.
  isDays: 120
  # Out-of-Sample-Fenster je Fold (Kalendertage): hier wird nur gemessen.
  oosDays: 30
  # Schrittweite der Folds (Kalendertage). = oosDays ⇒ lückenlose OOS-Kette;
  # darf nicht größer als oosDays sein.
  stepDays: 30
  # Sperrzone zwischen IS und OOS in Bars, damit kein Zustand hinüberleckt.
  # 0 = automatisch (Warmup der Strategie + maximale Haltedauer).
  embargoBars: 0
  # Zufalls-Stichproben aus dem Parameterraum je Fold (4–5000).
  samples: 150
  # Startwert des Zufallsgenerators — gleiche Config, gleiche Stichprobe.
  seed: 42
  # Mindestzahl OOS-Trades über alle Folds; darunter ist jede Kennzahl Rauschen.
  minOosTrades: 60
  # Anteil der Folds, die out-of-sample netto positiv sein müssen (0–1).
  minFoldPositiveShare: 0.6
  # Zielfunktion (Median über die Folds): sortino | sharpe | return_over_dd
  objective: sortino
  # Kosten-Stress: Der Kandidat muss auch bei ×Faktor Kosten bestehen.
  stressCostMultiplier: 1.5
  # Jüngste Kalendertage, die NIE zur Auswahl benutzt werden (nur Bericht).
  holdoutDays: 60
  # Champion nur ersetzen, wenn der Kandidat um diesen Faktor besser ist
  # (0.1 = 10 % Marge) — sonst tauscht man Rauschen gegen Rauschen.
  promotionMargin: 0.1
  # Probabilistic Sharpe Ratio der verketteten Out-of-Sample-Tagesrenditen
  # (gegen Sharpe 0): Wahrscheinlichkeit, dass die OOS-Kante echt ist.
  minPsrOos: 0.9
  # Deflated Sharpe (In-Sample, gegen die Zahl der Versuche) zusätzlich als
  # hartes Gate (true) oder nur im Bericht (false). Die OOS-Kette ist bereits
  # selektionsfrei; DSR bestraft breite Gitter mit toten Regionen doppelt.
  dsrIsGate: false
  # Höchstanteil des OOS-Nettos, den EIN einzelner Fold tragen darf.
  # Die Lücke, die das schließt: Der TSLA-Champion vom 07.09. bestand alle
  # acht Gates — 103 OOS-Trades, +958 $, 5 von 7 Folds positiv, PSR 0,95.
  # Von den +958 $ stammten +919 $ aus EINEM Monat. Ohne diesen Fold blieben
  # +39 $ über 91 Trades, und der unberührte Holdout war negativ. Kein Gate
  # schaute darauf: `fold_positive_share` zählt Folds, nicht ihr Gewicht.
  maxFoldNetShare: 0.5
  # Gepoolt bewerten: EIN Parametersatz je Strategie über das GANZE Universum
  # in einem Simulationslauf (ein Konto, ein Positionslimit, eine Notbremse),
  # statt jedes Symbol für sich. Je Symbol lautet die Frage „hat die Strategie
  # eine Kante auf LTC?" — bei 33 OOS-Trades gegen ein Gate von 60 nicht zu
  # beantworten. Gepoolt lautet sie „hat sie eine Kante in dieser
  # Assetklasse?" und hat bei 30 Symbolen rund dreißigmal so viele Trades.
  # Zugleich fällt ein ungezählter Freiheitsgrad weg: „bestes Symbol aus
  # dreißig" ist selbst eine Auswahl, die sonst niemand deflationiert.
  pooled: false
  # Korb je Fold: point_in_time wählt den Korb jedes Folds zu dessen OOS-Beginn
  # aus universe.candidates (Daten bis dahin, Hysterese Stand für Stand — wie
  # nachts); fixed misst den Korb der Config über das ganze Fenster (Auswahl
  # von heute, rückwärts angewandt). Ohne Kandidatenpool oder ungepoolt ohne
  # Wirkung. Mit point_in_time lädt `fetch` den ganzen Pool in voller Tiefe.
  foldMembership: point_in_time
  # Festkandidaten: vorregistrierte Parametersätze, die OHNE Suche durch
  # dieselben Folds, denselben Holdout und dieselben Gates laufen wie die
  # gesuchten Strategien und regulär um die Beförderung konkurrieren. Je
  # Eintrag `strategy`, `params` (Abweichungen von den Defaults, müssen im
  # paramSpace der Strategie liegen) und optional `label` (Name im Bericht):
  #   - { strategy: regime_allocation, params: { lookback: 120 }, label: Owner-Satz }
  # Ohne Suche gibt es keine Trials — der Deflated Sharpe ist bei ihnen
  # „nicht anwendbar" (wie beim Amtsinhaber); alles andere gilt voll.
  # `tier` (alpha | basis, Vorgabe alpha): `basis` ist die Basis-Allokation —
  # Marktexposition mit Trendfilter als Standard statt „nichts". Sie wird in
  # EINER durchgehenden Simulation über die ganze OOS-Kette gemessen
  # (Positionen über Fold-Grenzen, kein IS-Fenster) und an der Basis-Latte
  # unten geprüft, nie an den zehn Alpha-Gates; sie wird nie Alpha-Champion,
  # sondern steht als eigener Block `basis` in champion.json. Höchstens ein
  # Basis-Kandidat je Config, nur auf festem Korb (foldMembership: fixed
  # oder kein Kandidatenpool):
  #   - { strategy: regime_allocation, params: { lookback: 126 }, label: Basis V2, tier: basis }
  fixedCandidates: []
  # Basis-Latte: Gate-Gruppe `basis` für Festkandidaten mit tier: basis, alle
  # vier Gates müssen bestehen. Maßstab ist Kaufen-und-Halten des Korbs,
  # gleichgewichtet, ohne Kosten, über dieselbe Range; SPY nur im Bericht.
  # Das ist die ausführbare Form der Vorregistrierung — nach dem Lauf
  # geänderte Schwellen sind eine neue Version, keine Korrektur.
  basis:
    # basis_drawdown: MaxDD je Einheit mittlerer Exposure ≤ (1 − Anteil) ×
    # MaxDD des Korbs. Je Einheit Exposure, weil eine Basis, die halb in
    # Kasse steht, sonst automatisch den halben Drawdown hätte (Prüfbefund K2).
    minDrawdownReduction: 0.25
    # basis_sharpe: Sharpe p. a. ≥ Faktor × Sharpe des Korbs (Korb ≤ 0 ⇒
    # Basis > 0 genügt).
    minSharpeRatio: 0.9
    # basis_costs: Gebühren gesamt / |Netto| höchstens dieser Anteil.
    # basis_net_profit: Netto > 0, auch bei Kosten × stressCostMultiplier.
    maxCostShare: 0.1
    # Sizing-Semantik der Basis (Prüfbefund K4): Position = dieser Anteil der
    # Equity je Symbol — in der Messung UND in der Engine (Block `basis`,
    # positionPct); riskPerTradePct ist für die Basis ohne Wirkung. 20 % sind
    # die Vorregistrierung V2 (Risiko 4 % bei Stop 20 %).
    positionPct: 20
  # Eigener Korb der Basis-Allokation (leer = die Basis läuft auf der Einheit
  # des Laufs, nur bei festem Korb). Gesetzt ⇒ eigene Einheit „Basis (n
  # Symbole)" mit genau diesen Symbolen, fester Korb, eigene Bars-Ladung
  # (`fetch` lädt sie mit); die Alpha-Einheiten behalten ihren Korb je Fold.
  # Nur zusammen mit einem Festkandidaten tier: basis. Kein Tor.
  #   basisUniverse: [SPY, IWM, EFA, EEM, IEF, TLT, LQD, GLD, XLRE]
  basisUniverse: []

costs:
  # Slippage je Seite in Basispunkten (Marktorder gegen den Spread).
  slippageBps: 3
  # Halber Spread je Seite in Basispunkten.
  spreadBps: 2
  # SEC-Gebühr auf Verkaufserlöse (Satz; wird jährlich angepasst).
  secFeeRate: 0.0000278
  # FINRA Trading Activity Fee je verkaufter Aktie …
  finraTafPerShare: 0.000166
  # … gedeckelt je Order (USD).
  finraTafMax: 8.3
  # Krypto-Taker-Gebühr in % (nur assetClass: crypto).
  cryptoTakerPct: 0.25
  # Leihkosten für Shorts in % p. a. (nur bei allowShort: true).
  shortBorrowAnnualPct: 1

engine:
  # Abgleich Buch ↔ Broker (Positionen, Orders) alle X Sekunden.
  reconcileEverySec: 60
  # Karenz nach Bucket-Ende in Sekunden, bis die letzte Minuten-Bar da ist.
  barGraceSec: 4
  # Ohne frische Daten (Sekunden) keine neuen Einstiege — Exits laufen weiter.
  maxDataAgeSec: 180
  # Nach X Fehlern in Folge Halt (Grund: errors) bis `autotrd resume`.
  maxConsecutiveErrors: 5
  # Fremde Positionen beim Broker, die nicht im Buch stehen:
  # halt = keine neuen Einstiege bis geklärt | adopt = übernehmen mit Schutz-Stop
  onOrphan: halt

notify:
  # Telegram-Benachrichtigung (Fills, Halts, Fehler). Braucht TELEGRAM_BOT_TOKEN
  # und TELEGRAM_CHAT_ID in .env; fehlen sie, landet alles nur im Log.
  telegram: false

status:
  # HTTP-Status auf 127.0.0.1:<port> (GET /health, GET /status). 0 = aus.
  # Nie öffentlich binden — der Status enthält Kontodaten.
  httpPort: 8787

paths:
  # Ablage für State, Journal, Bars-Cache, Champion und Reports.
  # Die Umgebungsvariable AUTOTRD_HOME überschreibt diesen Wert.
  home: ./var
