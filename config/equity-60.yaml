# Probe: dieselben 30 Aktien auf STUNDENBARS — NUR Erkundung, nie die
# Plattform-Config.
#
# ── Warum es diese Datei gibt ─────────────────────────────────────────────
#
# Zwei Messungen liegen vor, und beide haben ein anderes Problem:
#
#   5 Minuten (08.09.)  Gebühren fressen 65,5 % bzw. 349,4 % des Bruttogewinns.
#                       Zu viele Round-Trips, jeder mit vollen Kosten.
#   Tagesbars (08.09.)  Gebühren nur noch 25,4 % — das Kostenproblem ist gelöst.
#                       Dafür zu wenig Beweislast: 4 bis 61 Trades je Fold, 23
#                       im Holdout. Bei so kleinen Stichproben kippt die
#                       Rangfolge zwischen OOS und Holdout komplett um.
#
# Die Stundenbar sitzt genau dazwischen: rund 6,5 Bars je Handelstag statt 78
# (5 min) oder 1 (Tag). Das ist die Konstellation, in der beides zugleich
# möglich wäre — Kosten klein genug UND genug unabhängige Beobachtungen, um
# eine Kante von Glück zu unterscheiden. Gemessen wurde sie für Aktien nie.
#
# ── Was hier NICHT verändert wurde ────────────────────────────────────────
#
# Kein Gate ist gelockert: minOosTrades, minFoldPositiveShare, minPsrOos,
# stressCostMultiplier, maxFoldNetShare und das feeShare-Gate stehen exakt wie
# in config/platform.yaml; ein Test hält das fest
# (test/scripts/probeConfigs.test.ts). Verändert sind Zeitrahmen und
# Datenfenster. Wer die Latte senkt, um ein Ergebnis zu bekommen, misst nichts
# mehr (CLAUDE.md §0.9).
#
# Das Fenster ist so gewählt, dass ungefähr so viele Folds herauskommen wie
# bei den anderen Proben (~7), nicht so, dass ein bestimmtes Ergebnis
# herauskommt. 1100 Kalendertage ≈ 760 Handelstage ≈ 4900 Stundenbars je
# Symbol; IS 250 / OOS 90 / Schritt 90, Holdout 180.
#
# ── Wie das gefahren wird ─────────────────────────────────────────────────
#
# Über .github/workflows/probe.yml — ohne Service-Account, ohne
# Veröffentlichungs-Schritte. Der Lauf kann Firestore nicht anfassen.

broker:
  mode: paper
  feed: iex
  # Bereinigte Tagesbars wie die Produktion (config/platform.yaml,
  # 15.09.2026). Ohne sie trägt der Kurs von BIL seine monatliche
  # Ausschüttung nicht: Zinsmaßstab und Parken wären ungefähr null und
  # kosteten nur Gebühren (src/risk/parken.ts, „Grenzen"). Minutenbars bleiben
  # roh — gehandelt wird zu echten Kursen.
  adjustment: all

universe:
  assetClass: us_equity
  # Identisch zu config/platform.yaml und config/equity-1440.yaml — sonst
  # vergliche man zwei Dinge auf einmal.
  symbols:
    [SPY, QQQ, IWM, DIA,
     AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AVGO, AMD, NFLX,
     CRM, ORCL, ADBE, INTC, CSCO, QCOM,
     JPM, BAC, WFC,
     XOM, CVX,
     JNJ, PFE, UNH,
     WMT, DIS]
  benchmark: SPY

timeframe: 60

# Bei 60 Minuten greifen die Sitzungstore wieder (anders als bei 1440) —
# unverändert aus platform.yaml, damit der Vergleich sauber bleibt.
session:
  noEntryFirstMin: 5
  noEntryLastMin: 30
  flattenBeforeCloseMin: 5

risk:
  riskPerTradePct: 0.5
  maxPositionPct: 20
  maxPositions: 4
  maxGrossExposurePct: 100
  maxDailyLossPct: 2
  maxDrawdownPct: 10
  allowShort: false
  # Geldmarkt-Parken wie die Produktion (config/platform.yaml, seit
  # 15.09.2026). Eine Probe misst nur dann etwas über die Plattform, wenn auch
  # bei ihr die brachliegende Kasse im Geldmarkt liegt: Der Zinsmaßstab unten
  # zieht den kurzen Zins ab, also muss das Konto ihn auch verdienen können.
  # Beides gehört zusammen — eines allein verschiebt die Messung
  # (test/scripts/probeConfigs.test.ts).
  cashParking:
    enabled: true
    symbol: BIL
    bandPct: 5
    bufferPct: 2
  pdt:
    respect: true
    minEquity: 25000
    maxDayTrades: 3

strategy:
  id: trend_donchian
  params: {}
  allowWithoutChampion: false

optimizer:
  # orb_breakout ist hier zulässig (Intraday-Zeitrahmen), aber eine
  # Eröffnungsspanne von mindestens 30 Minuten auf einem 60-Minuten-Raster
  # ergibt höchstens eine Bar Spanne — die Strategie hätte nichts zu messen.
  strategies: [trend_donchian, momentum_pullback, mean_reversion, cross_sectional_momentum]
  lookbackDays: 1100
  isDays: 250
  oosDays: 90
  stepDays: 90
  embargoBars: 0
  samples: 150
  seed: 42
  minOosTrades: 60
  minFoldPositiveShare: 0.6
  objective: sortino
  stressCostMultiplier: 1.5
  holdoutDays: 180
  promotionMargin: 0.1
  minPsrOos: 0.9
  dsrIsGate: false
  # Zinsmaßstab wie die Produktion (config/platform.yaml, 15.09.2026): Die
  # Geld-Gates rechnen auf dem ÜBERSCHUSS über den kurzen Zins, nicht über
  # null. Eine Probe, die gegen null misst, während die Plattform gegen BIL
  # misst, urteilt milder als das, was sie beurteilen soll
  # (docs/wissen/analysen/2026-09-15-die-plattform-misst-gegen-null.md).
  riskFreeSymbol: BIL
  maxFoldNetShare: 0.5
  pooled: true

costs:
  slippageBps: 3
  spreadBps: 2
  secFeeRate: 0.0000278
  finraTafPerShare: 0.000166
  finraTafMax: 8.3
  cryptoTakerPct: 0.25
  shortBorrowAnnualPct: 1

engine:
  reconcileEverySec: 60
  barGraceSec: 4
  maxDataAgeSec: 180
  maxConsecutiveErrors: 5
  onOrphan: halt

notify:
  telegram: false

status:
  httpPort: 0

# Eigener State-Ordner. Der Probe-Workflow setzt zwar `--home var-probe`,
# aber wer die Datei von Hand fährt, hätte sonst `var/champion.json` des
# Produktivlaufs überschrieben — den Champion, den die Plattform handelt.
paths:
  home: ./var-probe
